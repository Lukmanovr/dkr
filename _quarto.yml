project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    - "labs/*.qmd"
    - "!docs/"
  resources:
    - "assets/d3/*.js"
    - "labs/*.ipynb"

website:
  title: "DKR — Data & Knowledge Representation"
  description: "Graphs, knowledge graphs, and the machine learning that runs on them. Innopolis University, Fall 2026."
  site-url: https://lukmanovr.github.io/dkr/
  repo-url: https://github.com/lukmanovr/dkr
  repo-actions: [issue, source]
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  search:
    location: sidebar
    type: overlay
  page-navigation: true
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - section: Lectures
        contents:
          - href: lectures/01-why-graphs.qmd
            text: "1 · Why Graphs? Representing Relational Data"
          - href: lectures/02-classical-graph-ml.qmd
            text: "2 · Classical Graph ML: Structure as Features"
          - href: lectures/03-embeddings.qmd
            text: "3 · Shallow Node Embeddings"
          - href: lectures/04-knowledge-graphs.qmd
            text: "4 · Knowledge Graphs I: Facts as Geometry"
          - href: lectures/06-gcn.qmd
            text: "6 · GNNs I: Message Passing & GCN"
      - section: Labs
        contents:
          - href: labs/lab01.qmd
            text: "Lab 1 · Hello, graphs"
          - href: labs/lab02.qmd
            text: "Lab 2 · Structure as features"
          - href: labs/lab03.qmd
            text: "Lab 3 · DeepWalk from scratch"
          - href: labs/lab04.qmd
            text: "Lab 4 · TransE & RotatE on FB15k-237"
          - href: labs/lab06.qmd
            text: "Lab 6 · GCN from scratch → PyG"
      - section: Assessments
        contents:
          - href: homeworks/hw1.qmd
            text: "HW1 · Foundations (due Oct 1)"
      - section: Course
        contents:
          - href: reading-list.qmd
            text: Reading list
          - href: notation.qmd
            text: Notation reference
  page-footer:
    left: "DKR · Innopolis University · Fall 2026 · content [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/), code MIT"
    right: "Built with [Quarto](https://quarto.org) · [Source](https://github.com/lukmanovr/dkr)"

format:
  html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [cosmo, assets/theme-dark.scss]
    html-math-method: katex
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    include-in-header: assets/page-head.html
    include-after-body: assets/page-foot.html
    grid:
      body-width: 780px
      margin-width: 220px

execute:
  freeze: auto
