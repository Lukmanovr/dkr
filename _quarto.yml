project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    - "labs/*.qmd"
    - "!docs/"
  resources:
    - "assets/d3/*.js"
    - "labs/*.ipynb"

website:
  title: "DKR — Data & Knowledge Representation"
  description: "Graphs, knowledge graphs, and the machine learning that runs on them. Innopolis University, Fall 2026."
  site-url: https://lukmanovr.github.io/dkr/
  repo-url: https://github.com/lukmanovr/dkr
  repo-actions: [issue, source]
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  search:
    location: sidebar
    type: overlay
  page-navigation: true
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - section: Lectures
        contents:
          - href: lectures/01-why-graphs.qmd
            text: "1 · Why Graphs? Representing Relational Data"
          - href: lectures/02-classical-graph-ml.qmd
            text: "2 · Classical Graph ML: Structure as Features"
          - href: lectures/03-embeddings.qmd
            text: "3 · Shallow Node Embeddings"
          - href: lectures/04-knowledge-graphs.qmd
            text: "4 · Knowledge Graphs I: Facts as Geometry"
          - href: lectures/05-kg-reasoning.qmd
            text: "5 · Knowledge Graphs II: Reasoning & the LLM Era"
          - href: lectures/06-gcn.qmd
            text: "6 · GNNs I: Message Passing & GCN"
          - href: lectures/07-gnn-design.qmd
            text: "7 · GNNs II: The Design Space"
          - href: lectures/09-expressiveness.qmd
            text: "9 · GNN Theory: The Ceiling"
          - href: lectures/10-hetero-rgcn.qmd
            text: "10 · Heterogeneous Graphs & R-GCN"
          - href: lectures/11-scaling.qmd
            text: "11 · Scaling GNNs"
          - href: lectures/12-link-generation.qmd
            text: "12 · Link Prediction & Generation"
          - href: lectures/13-transformers.qmd
            text: "13 · Graph Transformers"
      - section: Labs
        contents:
          - href: labs/lab01.qmd
            text: "Lab 1 · Hello, graphs"
          - href: labs/lab02.qmd
            text: "Lab 2 · Structure as features"
          - href: labs/lab03.qmd
            text: "Lab 3 · DeepWalk from scratch"
          - href: labs/lab04.qmd
            text: "Lab 4 · TransE & RotatE on FB15k-237"
          - href: labs/lab05.qmd
            text: "Lab 5 · Query2box-lite & mini-GraphRAG"
          - href: labs/lab06.qmd
            text: "Lab 6 · GCN from scratch → PyG"
          - href: labs/lab07.qmd
            text: "Lab 7 · The design-space ablation"
          - href: labs/lab08.qmd
            text: "Lab 8 · Debrief + project kickoff"
          - href: labs/lab09.qmd
            text: "Lab 9 · The ceiling, verified"
          - href: labs/lab10.qmd
            text: "Lab 10 · Typed message passing"
          - href: labs/lab11.qmd
            text: "Lab 11 · Scaling, by hand"
          - href: labs/lab12.qmd
            text: "Lab 12 · Leak-proof links & generation"
          - href: labs/lab13.qmd
            text: "Lab 13 · RWSE, CSL & the GPS block"
      - section: Assessments
        contents:
          - href: homeworks/hw1.qmd
            text: "HW1 · Foundations (due Oct 1)"
          - href: exams/midterm.qmd
            text: "Midterm · review & logistics (Oct 15)"
          - href: exams/midterm-sample.qmd
            text: "Midterm · sample exam + solutions"
          - href: homeworks/hw2.qmd
            text: "HW2 · Deep models (due Oct 29)"
          - href: homeworks/hw3.qmd
            text: "HW3 · Frontiers (due Nov 26)"
      - section: Project
        contents:
          - href: project/index.qmd
            text: "Overview, milestones, rubric"
          - href: project/topics.qmd
            text: "Topic list (16 directions)"
      - section: Course
        contents:
          - href: reading-list.qmd
            text: Reading list
          - href: notation.qmd
            text: Notation reference
  page-footer:
    left: "DKR · Innopolis University · Fall 2026 · content [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/), code MIT"
    right: "Built with [Quarto](https://quarto.org) · [Source](https://github.com/lukmanovr/dkr)"

format:
  html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [cosmo, assets/theme-dark.scss]
    html-math-method: katex
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    include-in-header: assets/page-head.html
    include-after-body: assets/page-foot.html
    grid:
      body-width: 780px
      margin-width: 220px

execute:
  freeze: auto
