<figcaption class="fig-caption">Louvain on the karate club, drawn exactly as Lecture 1 draws it and as the Fiedler figure above: fill is the community it returns at the default resolution (seed 0), rings mark the members who joined Mr. Hi in 1977. It finds not two groups but four — a core of 11 and a satellite of 5 on Mr. Hi's side, a core of 12 and a satellite of 6 on the Officer's — and that finer partition scores Q = 0.420, above the Q = 0.358 of the real split; the two factions are exact unions of the four communities except for member 8, whom Louvain files with the Officer's core although he followed Mr. Hi (the same boundary member the Fiedler vector misplaces). This is not a bug but the resolution lesson: Q is maximized at whatever scale its null model makes cheapest, and on 78 unweighted ties two tight sub-groups per faction beat the coarser sociology, so the resolution parameter, not more optimization, is what would move the answer.</figcaption>
